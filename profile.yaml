candidate:
  target_roles:
    - Elixir Developer
    - Phoenix Developer
    - Ruby Developer
    - Ruby on Rails Developer
    - Backend Engineer
  search_keywords:
    - Elixir
    - Phoenix
    - Ruby
    - Rails
  strong_skills:
    - Elixir
    - Phoenix
    - Ruby
  geography:
    residence: Georgia
    preferred:
      - Worldwide remote
      - Remote explicitly open to Georgia
    relocation: false
  preferences:
    remote_only: true

evaluation_rules:
  recommended: Strong technical fit AND explicit eligibility to work remotely from Georgia.
  review: Relevant role, but location eligibility, experience requirements, or core skills are unclear.
  skip: Core stack mismatch, mandatory office work, or explicit geographic restriction excluding Georgia.
  principle: Do not assume 'remote' means worldwide. Missing location policy is not confirmation.
